<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- MENU LATERAL (Escondido) -->
    <div class="sidebar" id="sidebar">
        <ul>
            <li>📟 Calculadora Padrão</li>
            <li>📐 Científica</li>
            <li>📈 Representação gráfica</li>
            <li>💻 Programador</li>
            <li>📅 Cálculo de data</li>
            <li>💱 Conversor de Moeda</li>
            <li>🧊 Volume</li>
            <li>📏 Comprimento</li>
            <li>⚖️ Peso e massa</li>
            <li>🌡️ Temperatura</li>
            <li>⚡ Energia</li>
            <li>🗺️ Área</li>
            <li>🏃 Velocidade</li>
            <li>⏱️ Tempo</li>
            <li>💡 Potência</li>
        </ul>
    </div>

    <!-- ÁREA DA CALCULADORA -->
    <div class="calculator-area">
        <div class="calculator-container">

            <!-- Cabeçalho: Pontinhos à esquerda, Controles à direita -->
            <div class="window-header">
                
                <!-- Pontinhos (Clique para abrir menu) -->
                <div class="dots-group" onclick="toggleSidebar()">
                    <div class="window-dot dot-red"></div>
                    <div class="window-dot dot-yellow"></div>
                    <div class="window-dot dot-green"></div>
                </div>

                <!-- Controles da Janela (Minimizar, Maximizar, Fechar) -->
                <div class="window-controls">
                    <button class="control-btn" onclick="minimizeWindow()">—</button>
                    <button class="control-btn" onclick="maximizeWindow()">□</button>
                    <button class="control-btn" onclick="closeWindow()">✕</button>
                </div>

            </div>

            <!-- Display -->
            <div class="display" id="display">0</div>

            <!-- Botões -->
            <div class="buttons-grid">
                <button class="btn" onclick="appendToDisplay('MC')">MC</button>
                <button class="btn" onclick="appendToDisplay('MR')">MR</button>
                <button class="btn" onclick="appendToDisplay('M+')">M+</button>
                <button class="btn" onclick="appendToDisplay('M-')">M-</button>

                <button class="btn" onclick="clearDisplay()">CE</button>
                <button class="btn" onclick="clearDisplay()">C</button>
                <button class="btn" onclick="deleteLast()">DEL</button>
                <button class="btn btn-operator" onclick="appendToDisplay('/')">÷</button>

                <button class="btn" onclick="appendToDisplay('7')">7</button>
                <button class="btn" onclick="appendToDisplay('8')">8</button>
                <button class="btn" onclick="appendToDisplay('9')">9</button>
                <button class="btn btn-operator" onclick="appendToDisplay('*')">×</button>

                <button class="btn" onclick="appendToDisplay('4')">4</button>
                <button class="btn" onclick="appendToDisplay('5')">5</button>
                <button class="btn" onclick="appendToDisplay('6')">6</button>
                <button class="btn btn-operator" onclick="appendToDisplay('-')">-</button>

                <button class="btn" onclick="appendToDisplay('1')">1</button>
                <button class="btn" onclick="appendToDisplay('2')">2</button>
                <button class="btn" onclick="appendToDisplay('3')">3</button>
                <button class="btn btn-operator" onclick="appendToDisplay('+')">+</button>

                <button class="btn" onclick="appendToDisplay('%')">%</button>
                <button class="btn" onclick="appendToDisplay('0')">0</button>
                <button class="btn" onclick="appendToDisplay('.')">.</button>
                <button class="btn btn-equals" onclick="calculateResult()">=</button>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
